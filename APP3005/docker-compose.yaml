services:
  backend:
    build:
      context: ./aivestire-backend-tmp
    container_name: nest-server
    env_file:
      - ./aivestire-backend-tmp/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aivestire
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VERTEX_TRYON_ENABLED: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account.json
      SERVICE_ACCOUNT_FALLBACK_PATH: /app/runtime-config/service_account.json
      AI_TIMING_LOGS: "true"
      RECOMMENDATION_DUMMY_ONLY: "true"
    command:
      [
        "sh",
        "-c",
        "set -e; node scripts/bootstrap-service-account.mjs; node scripts/wait-for-services.mjs; node scripts/run-migrations.mjs; node dist/src/main.js"
      ]
    volumes:
      - ./aivestire-backend-tmp:/app/runtime-config:ro
    ports:
      - "0.0.0.0:3001:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - app-network

  backend-worker:
    build:
      context: ./aivestire-backend-tmp
    container_name: nest-worker
    command:
      [
        "sh",
        "-c",
        "set -e; node scripts/bootstrap-service-account.mjs; node scripts/wait-for-services.mjs; IS_WORKER_PROCESS=true node dist/src/worker/main.js"
      ]
    env_file:
      - ./aivestire-backend-tmp/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aivestire
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VERTEX_TRYON_ENABLED: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account.json
      SERVICE_ACCOUNT_FALLBACK_PATH: /app/runtime-config/service_account.json
      AI_TIMING_LOGS: "true"
      RECOMMENDATION_DUMMY_ONLY: "true"
    volumes:
      - ./aivestire-backend-tmp:/app/runtime-config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        # Use relative API base so Nginx in the frontend container can proxy to backend
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_TRY_ON_DEFAULT_PROVIDER: ${VITE_TRY_ON_DEFAULT_PROVIDER:-gemini}
        VITE_ENABLE_TRY_ON_PACK_DEV_SKIP: ${VITE_ENABLE_TRY_ON_PACK_DEV_SKIP:-false}
    container_name: aivestire-frontend
    ports:
      - "0.0.0.0:3005:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aivestire
    ports:
      - "0.0.0.0:5432:5432"   # optional (can remove later for security)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aivestire"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-server
    command: redis-server --appendonly yes
    ports:
      - "0.0.0.0:6379:6379"   # optional (can remove later)
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "0.0.0.0:8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
