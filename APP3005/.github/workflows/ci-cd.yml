name: CI - Build and API Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ci_cd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AiCore/APP3005
    env:
      SKIP_TWILIO: true
      SKIP_SMS_IN_DEV: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aivestire
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          npm ci --prefix aivestire-backend-tmp ||
            (echo "npm ci failed. Falling back to npm install." && npm install --prefix aivestire-backend-tmp --no-audit --no-fund)

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build backend
        run: npm run build --prefix aivestire-backend-tmp

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Print CI startup diagnostics
        run: |
          set -x
          echo "--- Tooling ---"
          node -v
          npm -v
          echo "--- Working directory ---"
          pwd
          ls -la
          echo "--- Build output check ---"
          ls -la aivestire-backend-tmp/dist || true
          ls -la aivestire-backend-tmp/dist/src | sed -n '1,200p' || true
          if [ -f aivestire-backend-tmp/dist/src/main.js ]; then
            echo "✅ dist/src/main.js exists"
          else
            echo "❌ dist/src/main.js is missing"
            exit 1
          fi
          echo "--- Start scripts available ---"
          node -e "const pkg=require('./aivestire-backend-tmp/package.json'); const scripts=Object.keys(pkg.scripts||{}).filter(s=>s.includes('start')); console.log(scripts.map(s=>s+' = '+pkg.scripts[s]).join('\n'))"

      - name: Wait for DB and Redis to be reachable
        run: |
          echo "--- Waiting for PostgreSQL ---"
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/tmp/pg_check.log 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL did not become ready in time"
              cat /tmp/pg_check.log
              exit 1
            fi
            echo "PostgreSQL not ready yet, retrying ($i/30)"
            sleep 2
          done

          echo "--- Waiting for Redis ---"
          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG >/tmp/redis_check.log 2>&1; then
              echo "Redis is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Redis did not become ready in time"
              cat /tmp/redis_check.log
              exit 1
            fi
            echo "Redis not ready yet, retrying ($i/30)"
            sleep 2
          done

      - name: Preflight database connectivity
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aivestire
          NODE_ENV: test
        run: npm run script:check-db --prefix aivestire-backend-tmp

      # ── FIX 1: Run Prisma migrations so tables exist before server starts ──
      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aivestire
          NODE_ENV: test
        run: |
          cd aivestire-backend-tmp
          if [ -f prisma/schema.prisma ]; then
            echo "Running Prisma migrations..."
            npx prisma migrate deploy
            echo "✅ Migrations complete"
          else
            echo "No prisma/schema.prisma found — skipping migrations"
          fi

      - name: Start API and run health checks
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aivestire
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CORS_ORIGIN: http://localhost:5173

          # ── FIX 2: JWT secrets long enough (min 32 chars) ──────────────────
          JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET || 'ci-jwt-access-secret-32-chars-min-xx' }}
          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET || 'ci-jwt-refresh-secret-32-chars-min-x' }}

          API_BASE_URL: http://127.0.0.1:3000
          API_HEALTH_ENDPOINTS: /,/api/v1/tryon/health
          REQUIRE_HEALTH_FIELD: true
          REQUIRE_HEALTH_TRUE: false
          HEALTH_CHECK_STARTUP_TIMEOUT_MS: 120000
          SKIP_TWILIO: "true"
          SKIP_SMS_IN_DEV: "true"
          PRISMA_CONNECT_RETRIES: 120
          PRISMA_CONNECT_RETRY_DELAY_MS: 1000
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'ci-placeholder' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || '000000000000000' }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || 'ci-placeholder-secret-xxxxxxxx' }}

        run: |
          set -euo pipefail
          BACKEND_LOG="$PWD/backend-server.log"
          echo "--- Backend log file path: $BACKEND_LOG ---"
          echo "--- Backend log initial state ---"
          if [ -f "$BACKEND_LOG" ]; then
            ls -lh "$BACKEND_LOG" || true
            tail -n 40 "$BACKEND_LOG" || true
          else
            echo "Backend log file does not exist yet"
          fi

          echo "--- Checking start script exists ---"
          # ── FIX 3: Fall back to start:prod if start:prod:ci doesn't exist ──
          START_SCRIPT="start:prod:ci"
          if ! node -e "const p=require('./aivestire-backend-tmp/package.json'); if(!p.scripts['$START_SCRIPT']) process.exit(1)" 2>/dev/null; then
            echo "⚠️  '$START_SCRIPT' not found in package.json, falling back to 'start:prod'"
            START_SCRIPT="start:prod"
          fi
          echo "Using start script: $START_SCRIPT"

          echo "--- Starting backend (script: $START_SCRIPT) ---"
          npm run "$START_SCRIPT" --prefix aivestire-backend-tmp > "$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!

          echo "Backend PID: $BACKEND_PID"

          # Wait and check process didn't die immediately
          sleep 5
          if ! ps -p "$BACKEND_PID" > /dev/null 2>&1; then
            echo "❌ Backend process exited immediately after launch"
            echo "--- Backend log ---"
            cat "$BACKEND_LOG" || echo "No log file found"
            exit 1
          fi

          echo "✅ Backend process is alive (PID $BACKEND_PID), running health check..."

          if ! npm run ci:health-check --prefix aivestire-backend-tmp; then
            echo "❌ Health check failed"
            echo "--- Backend log (head) ---"
            sed -n '1,200p' "$BACKEND_LOG" || true
            echo "--- Backend log (tail) ---"
            tail -n 100 "$BACKEND_LOG" || true
            echo "--- Backend log file size ---"
            ls -lh "$BACKEND_LOG" || true
            echo "--- Port 3000 status ---"
            ss -tlnp | grep 3000 || echo "Nothing listening on port 3000"
            kill "$BACKEND_PID" || true
            wait "$BACKEND_PID" 2>/dev/null || true
            exit 1
          fi

          echo "✅ Health check passed"
          kill "$BACKEND_PID" || true
          wait "$BACKEND_PID" 2>/dev/null || true

      - name: Print backend logs on failure
        if: failure()
        run: |
          echo "--- Full backend log ---"
          if [ -f backend-server.log ]; then
            cat backend-server.log
          else
            echo "No backend-server.log found"
          fi
          echo ""
          echo "--- Port 3000 status ---"
          ss -tlnp | grep 3000 || echo "Nothing on port 3000"
          echo ""
          echo "--- Node processes ---"
          ps aux | grep node || true
