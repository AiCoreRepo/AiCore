name: CI - Build and API Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ci_cd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AiCore/APP3005

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aivestire
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci --prefix aivestire-backend-tmp

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build backend
        run: npm run build --prefix aivestire-backend-tmp

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Print CI startup diagnostics
        run: |
          set -x
          echo "--- Tooling ---"
          node -v
          npm -v
          echo "--- Working directory ---"
          pwd
          ls -la
          echo "--- Backend package + lockfile check ---"
          cat aivestire-backend-tmp/package.json | sed -n '1,140p'
          [ -f aivestire-backend-tmp/package-lock.json ] && sed -n '1,120p' aivestire-backend-tmp/package-lock.json | cat
          echo "--- Installed backend deps check (twilio) ---"
          (cd aivestire-backend-tmp && npm ls --depth=0 twilio || true)
          if [ -f aivestire-backend-tmp/node_modules/twilio/package.json ]; then
            echo "✅ twilio module exists"
          else
            echo "⚠️ twilio module is missing"
          fi
          echo "--- Build output check ---"
          ls -la aivestire-backend-tmp/dist || true
          ls -la aivestire-backend-tmp/dist/src | sed -n '1,200p' || true
          if [ -f aivestire-backend-tmp/dist/src/main.js ]; then
            echo "✅ dist/src/main.js exists"
          else
            echo "❌ dist/src/main.js is missing"
            exit 1
          fi
          echo "--- Start command ---"
          node -e "const pkg=require('./aivestire-backend-tmp/package.json'); console.log('start:prod =', pkg.scripts['start:prod'])"

      - name: Start API and run health checks
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aivestire
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CORS_ORIGIN: http://localhost:5173
          # Add these in repository secrets if your app requires them for startup.
          JWT_ACCESS_TOKEN_SECRET: ci-jwt-access-secret
          JWT_REFRESH_TOKEN_SECRET: ci-jwt-refresh-secret
          API_BASE_URL: http://127.0.0.1:3000
          API_HEALTH_ENDPOINTS: /,/api/v1/tryon/health
          REQUIRE_HEALTH_FIELD: true
          REQUIRE_HEALTH_TRUE: false
          HEALTH_CHECK_STARTUP_TIMEOUT_MS: 240000
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'ci-cloud-name' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || 'ci-cloud-key' }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || 'ci-cloud-secret' }}
        run: |
          set -e
          echo "--- Starting backend ---"
          echo "PORT=$PORT"
          echo "DATABASE_URL=$DATABASE_URL"
          echo "HEALTH_TIMEOUT_MS=$HEALTH_CHECK_STARTUP_TIMEOUT_MS"
          npm run start:prod --prefix aivestire-backend-tmp > backend.log 2>&1 &
          BACKEND_PID=$!
          sleep 2
          echo "Backend PID: $BACKEND_PID"
          if ! ps -p "$BACKEND_PID" > /dev/null 2>&1; then
            echo "Backend process exited immediately."
            if [ -f backend.log ]; then
              sed -n '1,200p' backend.log
            else
              echo "No backend.log created"
            fi
            exit 1
          fi
          ps -p "$BACKEND_PID" -f || true
          if ! npm run ci:health-check --prefix aivestire-backend-tmp; then
            echo "--- Backend logs ---"
            if [ -f backend.log ]; then
              echo "--- Backend log (head) ---"
              sed -n '1,120p' backend.log
              echo "--- Backend log (tail) ---"
              tail -n 200 backend.log
            fi
            kill "$BACKEND_PID" || true
            wait "$BACKEND_PID" || true
            exit 1
          fi
          kill "$BACKEND_PID"

      - name: Print backend logs on failure
        if: failure()
        run: |
          echo "--- Backend logs ---"
          if [ -f backend.log ]; then
            cat backend.log
          fi
