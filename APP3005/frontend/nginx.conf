server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream backend:3000;
    set $body_analyzer_upstream body-analyzer:8898;
    set $recommendation_upstream recommendation-api:8799;

    # Routes that already include /api in backend (e.g. /api/products, /api/v1/tryon)
    # Frontend uses BASE_URL=/api, so these become /api/api/...
    location /api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Routes without /api in backend (e.g. /auth, /admin, /aura, etc.)
    location /api/ {
        # Strip /api prefix so /api/auth/register maps to /auth/register
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /ai/body {
        proxy_pass http://$body_analyzer_upstream/body_analyze_json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /ai/recommend {
        proxy_pass http://$recommendation_upstream/recommend-base64;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # n8n webhook proxy (avoids browser CORS)
    location = /n8n/track-visit {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        proxy_pass https://atul56.app.n8n.cloud/webhook/track-visit;
        proxy_ssl_server_name on;
        proxy_set_header Host atul56.app.n8n.cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri /index.html;
    }
}
