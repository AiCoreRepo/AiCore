server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream backend:3000;
    set $body_analyzer_upstream body-analyzer:8898;
    set $recommendation_upstream recommendation-api:8799;

    # ============================================
    # API ROUTING
    # NestJS controllers do NOT use a leading /api prefix.
    # Frontend uses VITE_API_URL=/api, so strip one /api.
    # Handle accidental double /api/api by stripping both.
    # ============================================

    # Handle double /api from frontend (BASE_URL=/api + endpoint /api/xxx)
    location /api/api/ {
        client_max_body_size 100m;
        rewrite ^/api/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # Strip /api prefix for all backend routes
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /ai/body {
        proxy_pass http://$body_analyzer_upstream/body_analyze_json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /ai/recommend {
        proxy_pass http://$recommendation_upstream/recommend-base64;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # n8n webhook proxy (avoids browser CORS)
    location = /n8n/track-visit {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        proxy_pass https://atul56.app.n8n.cloud/webhook/track-visit;
        proxy_ssl_server_name on;
        proxy_set_header Host atul56.app.n8n.cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri /index.html;
    }
}
