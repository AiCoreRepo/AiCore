name: CI/CD Pipeline (GCP VM Compose)

on:
  pull_request:
    branches:
      - recommendation_model
      - uat-server
  push:
    branches:
      - recommendation_model
      - uat-server

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: APP3005/aivestire-backend-tmp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: APP3005/aivestire-backend-tmp/package-lock.json

      - name: Install Dependencies (Backend)
        working-directory: APP3005/aivestire-backend-tmp
        run: |
          npm install

      - name: Run Tests (Backend)
        working-directory: APP3005/aivestire-backend-tmp
        run: npm run test --if-present

      - name: Build (Backend)
        working-directory: APP3005/aivestire-backend-tmp
        run: npm run build

      - name: Print CI startup diagnostics
        working-directory: APP3005/aivestire-backend-tmp
        run: |
          echo "GCP_PIPELINE_MARKER=v1-health-log"
          echo "GITHUB_WORKFLOW_FILE_REV=$(sha1sum ../.github/workflows/gcp-vm-compose-deploy.yml | awk '{print $1}')"
          node -v
          npm -v
          echo "--- Start scripts ---"
          node -e "const pkg=require('./package.json'); const scripts=Object.keys(pkg.scripts||{}).filter(s=>s.includes('start') || s.includes('ci')); console.log(scripts.map(s=>s+' = '+pkg.scripts[s]).join('\n'))"
          echo "--- dist check ---"
          if [ -f dist/src/main.js ]; then
            echo "✅ dist/src/main.js exists"
          else
            echo "❌ dist/src/main.js missing"
            exit 1
          fi

      - name: Wait for PostgreSQL and Redis to be reachable
        run: |
          echo "--- Waiting for PostgreSQL ---"
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/tmp/pg_check.log 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL did not become ready in time"
              cat /tmp/pg_check.log
              exit 1
            fi
            echo "PostgreSQL not ready yet, retrying ($i/30)"
            sleep 2
          done

          echo "--- Waiting for Redis ---"
          for i in {1..30}; do
            if (exec 3<>/dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; then
              echo "Redis is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Redis did not become ready in time"
              (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1 || true
              exit 1
            fi
            echo "Redis not ready yet, retrying ($i/30)"
            sleep 2
          done

      - name: Run API Health Checks
        working-directory: APP3005/aivestire-backend-tmp
        env:
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-jwt-secret
          JWT_EXPIRATION_TIME: 1h
          JWT_REFRESH_EXPIRATION_TIME: 7d
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          ADMIN_SECRET: ci-admin-secret
          NODE_ENV: test
          SKIP_TWILIO: "true"
          SKIP_SMS_IN_DEV: "true"
          HEALTH_CHECK_STARTUP_TIMEOUT_MS: 120000
          PRISMA_CONNECT_RETRIES: 120
          PRISMA_CONNECT_RETRY_DELAY_MS: 1000
        run: |
          set -euo pipefail
          echo "GCP_PIPELINE_MARKER=v1-health-log"
          BACKEND_LOG="$PWD/backend-server.log"
          echo "--- Backend log file path: $BACKEND_LOG ---"
          if [ -f "$BACKEND_LOG" ]; then
            ls -lh "$BACKEND_LOG" || true
            tail -n 40 "$BACKEND_LOG" || true
          else
            echo "Backend log file does not exist yet"
          fi

          START_SCRIPT="start:prod:ci"
          if ! node -e "const p=require('./package.json'); if(!p.scripts['$START_SCRIPT']) process.exit(1)" 2>/dev/null; then
            echo "⚠️  '$START_SCRIPT' not found in package.json, falling back to 'start:prod'"
            START_SCRIPT="start:prod"
          fi
          echo "Using start script: $START_SCRIPT"

          npm run "$START_SCRIPT" > backend-server.log 2>&1 &
          BACKEND_PID=$!

          cleanup() {
            if kill -0 "$BACKEND_PID" >/dev/null 2>&1; then
              kill "$BACKEND_PID" >/dev/null 2>&1 || true
              wait "$BACKEND_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "Backend PID: $BACKEND_PID"
          echo "Running health check..."
          if ! npm run ci:health-check; then
            echo "❌ Health check failed"
            echo "--- Backend log (head) ---"
            sed -n '1,200p' "$BACKEND_LOG" || true
            echo "--- Backend log (tail) ---"
            tail -n 100 "$BACKEND_LOG" || true
            echo "--- Port 3000 status ---"
            ss -tlnp | grep 3000 || echo "Nothing listening on port 3000"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: Dump backend logs on failure
        if: failure()
        working-directory: APP3005/aivestire-backend-tmp
        run: |
          echo "--- Full backend log ---"
          if [ -f backend-server.log ]; then
            cat backend-server.log
          else
            echo "No backend-server.log found"
          fi
          echo "--- Node processes ---"
          ps aux | grep node || true

      - name: Dump backend log and status (always)
        if: always()
        working-directory: APP3005/aivestire-backend-tmp
        run: |
          echo "--- Guaranteed backend log dump ---"
          echo "Log path: $PWD/backend-server.log"
          if [ -f backend-server.log ]; then
            ls -lh backend-server.log || true
            tail -n 200 backend-server.log || true
          else
            echo "No backend-server.log exists"
          fi
          ss -tlnp | grep 3000 || echo "Nothing listening on port 3000"

  lint:
    name: Lint (Backend) [non-blocking]
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: APP3005/aivestire-backend-tmp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: APP3005/aivestire-backend-tmp/package-lock.json

      - name: Install Dependencies (Backend)
        working-directory: APP3005/aivestire-backend-tmp
        run: npm install

      - name: Lint (Backend)
        working-directory: APP3005/aivestire-backend-tmp
        run: npm run lint --if-present

  deploy:
    name: Deploy to GCP VM (Docker Compose)
    needs: ci # Only run if required CI passes (lint is optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref_name == 'recommendation_model' || github.ref_name == 'uat-server')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose on VM
        run: |
          GCP_TARGET_BRANCH="${{ github.ref_name }}"
          if [ "$GCP_TARGET_BRANCH" = "uat-server" ]; then
            echo "Deploy target: uat-server branch -> UAT VM"
            GCP_INSTANCE_HOST="${{ secrets.GCP_UAT_INSTANCE_HOST }}"
            GCP_INSTANCE_USER="${{ secrets.GCP_UAT_INSTANCE_USER }}"
            GCP_INSTANCE_SSH_KEY="${{ secrets.GCP_UAT_INSTANCE_SSH_KEY }}"
            GCP_DEPLOY_PATH="${{ vars.GCP_UAT_DEPLOY_PATH }}"
            GCP_COMPOSE_FILE="${{ vars.GCP_UAT_COMPOSE_FILE }}"
            GCP_COMPOSE_SERVICES="${{ vars.GCP_UAT_COMPOSE_SERVICES }}"
            GCP_BACKEND_ENV_B64="${{ secrets.GCP_UAT_BACKEND_ENV_B64 }}"
            GCP_USE_LOCAL_INFRA="${{ vars.GCP_UAT_USE_LOCAL_INFRA }}"
            GCP_SERVER_BASE_URL="${{ vars.GCP_UAT_SERVER_BASE_URL }}"
          elif [ "$GCP_TARGET_BRANCH" = "recommendation_model" ]; then
            echo "Deploy target: recommendation_model branch -> DEV VM"
            GCP_INSTANCE_HOST="${{ secrets.GCP_INSTANCE_HOST }}"
            GCP_INSTANCE_USER="${{ secrets.GCP_INSTANCE_USER }}"
            GCP_INSTANCE_SSH_KEY="${{ secrets.GCP_INSTANCE_SSH_KEY }}"
            GCP_DEPLOY_PATH="${{ vars.GCP_DEPLOY_PATH }}"
            GCP_COMPOSE_FILE="${{ vars.GCP_COMPOSE_FILE }}"
            GCP_COMPOSE_SERVICES="${{ vars.GCP_COMPOSE_SERVICES }}"
            GCP_BACKEND_ENV_B64="${{ secrets.GCP_BACKEND_ENV_B64 }}"
            GCP_USE_LOCAL_INFRA="${{ vars.GCP_USE_LOCAL_INFRA }}"
            GCP_SERVER_BASE_URL="${{ vars.GCP_SERVER_BASE_URL }}"
          else
            echo "Unsupported deployment branch: $GCP_TARGET_BRANCH"
            exit 1
          fi

          if [ -z "$GCP_SERVER_BASE_URL" ]; then
            GCP_SERVER_BASE_URL="${{ secrets.GCP_UAT_SERVER_BASE_URL }}"
          fi
          if [ -z "$GCP_SERVER_BASE_URL" ] && [ "$GCP_TARGET_BRANCH" = "recommendation_model" ]; then
            GCP_SERVER_BASE_URL="${{ secrets.GCP_SERVER_BASE_URL }}"
          fi

          if [ -z "$GCP_INSTANCE_HOST" ]; then
            GCP_INSTANCE_HOST="${{ vars.GCP_UAT_INSTANCE_HOST }}"
          fi
          if [ -z "$GCP_INSTANCE_HOST" ]; then
            GCP_INSTANCE_HOST="${{ vars.GCP_INSTANCE_HOST }}"
          fi
          if [ -z "$GCP_INSTANCE_USER" ]; then
            GCP_INSTANCE_USER="${{ vars.GCP_UAT_INSTANCE_USER }}"
          fi
          if [ -z "$GCP_INSTANCE_USER" ]; then
            GCP_INSTANCE_USER="${{ vars.GCP_INSTANCE_USER }}"
          fi
          if [ -z "$GCP_INSTANCE_SSH_KEY" ]; then
            GCP_INSTANCE_SSH_KEY="${{ secrets.GCP_INSTANCE_SSH_KEY }}"
          fi
          if [ -z "$GCP_DEPLOY_PATH" ]; then
            GCP_DEPLOY_PATH="${{ vars.GCP_UAT_DEPLOY_PATH }}"
          fi
          if [ -z "$GCP_DEPLOY_PATH" ]; then
            GCP_DEPLOY_PATH="${{ vars.GCP_DEPLOY_PATH }}"
          fi
          if [ -z "$GCP_DEPLOY_PATH" ]; then
            GCP_DEPLOY_PATH="${{ secrets.GCP_DEPLOY_PATH }}"
          fi
          if [ -z "$GCP_COMPOSE_FILE" ]; then
            GCP_COMPOSE_FILE="${{ vars.GCP_UAT_COMPOSE_FILE }}"
          fi
          if [ -z "$GCP_COMPOSE_FILE" ]; then
            GCP_COMPOSE_FILE="${{ secrets.GCP_COMPOSE_FILE }}"
          fi
          if [ -z "$GCP_COMPOSE_SERVICES" ]; then
            GCP_COMPOSE_SERVICES="${{ vars.GCP_UAT_COMPOSE_SERVICES }}"
          fi
          if [ -z "$GCP_COMPOSE_SERVICES" ]; then
            GCP_COMPOSE_SERVICES="${{ secrets.GCP_COMPOSE_SERVICES }}"
          fi
          if [ -z "$GCP_BACKEND_ENV_B64" ]; then
            GCP_BACKEND_ENV_B64="${{ vars.GCP_UAT_BACKEND_ENV_B64 }}"
          fi
          if [ -z "$GCP_BACKEND_ENV_B64" ]; then
            GCP_BACKEND_ENV_B64="${{ vars.GCP_BACKEND_ENV_B64 }}"
          fi
          if [ -z "$GCP_USE_LOCAL_INFRA" ]; then
            GCP_USE_LOCAL_INFRA="${{ vars.GCP_UAT_USE_LOCAL_INFRA }}"
          fi
          if [ -z "$GCP_USE_LOCAL_INFRA" ]; then
            GCP_USE_LOCAL_INFRA="${{ secrets.GCP_USE_LOCAL_INFRA }}"
          fi
          if [ -z "$GCP_USE_LOCAL_INFRA" ]; then
            GCP_USE_LOCAL_INFRA="true"
          fi

          GCP_USE_LOCAL_INFRA="$(printf '%s' "$GCP_USE_LOCAL_INFRA" | tr '[:upper:]' '[:lower:]')"
          if [ "$GCP_USE_LOCAL_INFRA" != "true" ] && [ "$GCP_USE_LOCAL_INFRA" != "false" ]; then
            echo "Invalid GCP_USE_LOCAL_INFRA value: $GCP_USE_LOCAL_INFRA. Use 'true' or 'false'."
            exit 1
          fi

          echo "Resolved deployment settings:" 
          echo "  Host: ${GCP_INSTANCE_HOST}"
          echo "  User: ${GCP_INSTANCE_USER}"
          echo "  Deploy Path: ${GCP_DEPLOY_PATH}"
          echo "  Compose File: ${GCP_COMPOSE_FILE:-docker-compose.yml}"
          echo "  Compose Services: ${GCP_COMPOSE_SERVICES:-backend frontend body-analyzer recommendation-api}"
          echo "  Use Local Infra (db+redis): ${GCP_USE_LOCAL_INFRA}"
          if [ -n "$GCP_BACKEND_ENV_B64" ]; then
            echo "  Backend env payload: provided (base64 length ${#GCP_BACKEND_ENV_B64})"
          else
            echo "  Backend env payload: not provided"
          fi

          if [ -z "$GCP_INSTANCE_HOST" ] || [ -z "$GCP_INSTANCE_USER" ] || [ -z "$GCP_INSTANCE_SSH_KEY" ] || [ -z "$GCP_DEPLOY_PATH" ]; then
            echo "Missing required deployment config: GCP_INSTANCE_HOST, GCP_INSTANCE_USER, GCP_INSTANCE_SSH_KEY, or GCP_DEPLOY_PATH."
            exit 1
          fi

          COMPOSE_FILE="$GCP_COMPOSE_FILE"
          if [ -z "$COMPOSE_FILE" ]; then
            COMPOSE_FILE="docker-compose.yml"
          fi

          COMPOSE_SERVICES="$GCP_COMPOSE_SERVICES"
          if [ -z "$COMPOSE_SERVICES" ]; then
            COMPOSE_SERVICES="backend frontend body-analyzer recommendation-api"
          fi
          COMPOSE_SERVICES="$(printf '%s' "$COMPOSE_SERVICES" | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')"
          SSH_DEPLOY_PATH="$GCP_DEPLOY_PATH"
          COMPOSE_FILE_B64="$(printf '%s' "$COMPOSE_FILE" | base64 -w0)"
          COMPOSE_SERVICES_B64="$(printf '%s' "$COMPOSE_SERVICES" | base64 -w0)"
          DEPLOY_PATH_B64="$(printf '%s' "$SSH_DEPLOY_PATH" | base64 -w0)"
          BACKEND_ENV_B64="$(printf '%s' "$GCP_BACKEND_ENV_B64" | base64 -w0)"
          LOCAL_INFRA_B64="$(printf '%s' "$GCP_USE_LOCAL_INFRA" | base64 -w0)"
          TARGET_BRANCH_B64="$(printf '%s' "$GCP_TARGET_BRANCH" | base64 -w0)"
          echo "Encoded payload lengths: file=$(( ${#COMPOSE_FILE_B64} )) services=$(( ${#COMPOSE_SERVICES_B64} )) deploy=$(( ${#DEPLOY_PATH_B64} ))"
          echo "Encoded deploy path prefix: $(printf '%.20s' "$DEPLOY_PATH_B64")..."

          mkdir -p ~/.ssh
          printf '%b\n' "$GCP_INSTANCE_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if ! ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1; then
            echo "Invalid SSH private key format in GCP_INSTANCE_SSH_KEY."
            exit 1
          fi

          echo "Testing SSH connectivity to $GCP_INSTANCE_USER@$GCP_INSTANCE_HOST..."
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o PasswordAuthentication=no \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_rsa \
            "$GCP_INSTANCE_USER@$GCP_INSTANCE_HOST" \
            "echo SSH_OK"; then
            echo "SSH auth test failed. Verify:"
            echo "1) Secret GCP_INSTANCE_USER matches OS user on VM"
            echo "2) Public key for this private key exists in ~/.ssh/authorized_keys on the VM"
            echo "3) VM allows inbound SSH from GitHub runners"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            "$GCP_INSTANCE_USER@$GCP_INSTANCE_HOST" \
            "COMPOSE_FILE_B64='${COMPOSE_FILE_B64}' COMPOSE_SERVICES_B64='${COMPOSE_SERVICES_B64}' DEPLOY_PATH_B64='${DEPLOY_PATH_B64}' BACKEND_ENV_B64='${BACKEND_ENV_B64}' LOCAL_INFRA_B64='${LOCAL_INFRA_B64}' TARGET_BRANCH_B64='${TARGET_BRANCH_B64}' bash -s" <<'EOF'
          set -e
          COMPOSE_FILE="$(printf '%s' "$COMPOSE_FILE_B64" | base64 -d)"
          COMPOSE_SERVICES="$(printf '%s' "$COMPOSE_SERVICES_B64" | base64 -d)"
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          BACKEND_ENV_B64="$(printf '%s' "$BACKEND_ENV_B64" | base64 -d)"
          GCP_USE_LOCAL_INFRA="$(printf '%s' "$LOCAL_INFRA_B64" | base64 -d)"
          GCP_TARGET_BRANCH="$(printf '%s' "$TARGET_BRANCH_B64" | base64 -d)"
          if [ -z "$GCP_TARGET_BRANCH" ]; then
            echo "Remote did not receive target branch"
            exit 1
          fi
          echo "Remote received deploy path: ${DEPLOY_PATH}"
          if [ -z "$DEPLOY_PATH" ]; then
            echo "Remote did not receive deploy path (empty)"
          fi
          echo "Remote compose file: ${COMPOSE_FILE}"
          echo "Remote compose services: ${COMPOSE_SERVICES}"
          echo "Remote local infra usage: ${GCP_USE_LOCAL_INFRA}"
          case " $COMPOSE_SERVICES " in
            *" recommendation-api "*) ;;
            *)
              echo "GCP_COMPOSE_SERVICES must include 'recommendation-api'."
              exit 1
              ;;
          esac
          if command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            COMPOSE_CMD="docker compose"
          fi
          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ]; then
            echo "Invalid deploy path: $DEPLOY_PATH"
            exit 1
          fi

          BACKEND_ENV_FILE="${DEPLOY_PATH}/APP3005/aivestire-backend-tmp/.env"
          mkdir -p "$(dirname "$BACKEND_ENV_FILE")"
          if [ -n "$BACKEND_ENV_B64" ]; then
            echo "Writing backend env file from GCP_BACKEND_ENV_B64"
            printf '%s' "$BACKEND_ENV_B64" > "$BACKEND_ENV_FILE"
          elif [ ! -f "$BACKEND_ENV_FILE" ]; then
            echo "No backend env file found; creating managed fallback file"
            printf '%s\n' \
              "NODE_ENV=production" \
              "JWT_SECRET=ci-jwt-secret" \
              "ADMIN_JWT_SECRET=ci-admin-secret" \
              "ADMIN_SECRET=ci-admin-secret" \
              > "$BACKEND_ENV_FILE"
          fi

          if [ "$GCP_USE_LOCAL_INFRA" = "true" ]; then
            echo "Forcing local compose db/redis settings in backend env"
            sed -i \
              '/^DATABASE_URL=/d;/^DB_WAIT_HOST=/d;/^DB_WAIT_PORT=/d;/^REDIS_HOST=/d;/^REDIS_PORT=/d;/^REDIS_URL=/d;/^FORCE_LOCAL_REDIS=/d' \
              "$BACKEND_ENV_FILE"
            printf '%s\n' \
              "DATABASE_URL=postgresql://postgres:postgres@db:5540/aivestire" \
              "DB_WAIT_HOST=db" \
              "DB_WAIT_PORT=5540" \
              "REDIS_HOST=redis" \
              "REDIS_PORT=6380" \
              "FORCE_LOCAL_REDIS=true" \
              >> "$BACKEND_ENV_FILE"
          else
            echo "External infra mode enabled: using DATABASE_URL/REDIS_* from backend env file"
          fi
          chmod 600 "$BACKEND_ENV_FILE"
          echo "Backend env resolved snapshot:"
          grep -E '^(DATABASE_URL|DB_WAIT_HOST|DB_WAIT_PORT|REDIS_HOST|REDIS_PORT|FORCE_LOCAL_REDIS)=' "$BACKEND_ENV_FILE" || true

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "Deploy path does not exist: $DEPLOY_PATH"
            exit 1
          fi

          cd "$DEPLOY_PATH"

          if [ -d .git ]; then
            git fetch origin
            git checkout "$GCP_TARGET_BRANCH"
            git reset --hard "origin/$GCP_TARGET_BRANCH"
          else
            echo "No git repository found at $DEPLOY_PATH. Expected checked-out repo on VM."
            exit 1
          fi

          read -r -a COMPOSE_SERVICES_ARR <<< "$COMPOSE_SERVICES"
          if [ ${#COMPOSE_SERVICES_ARR[@]} -eq 0 ]; then
            echo "No services resolved from compose services input"
            exit 1
          fi

          DEPLOY_SERVICES=("${COMPOSE_SERVICES_ARR[@]}")
          for base_service in db redis; do
            should_add=true
            for existing_service in "${DEPLOY_SERVICES[@]}"; do
              if [ "$existing_service" = "$base_service" ]; then
                should_add=false
                break
              fi
            done

            if [ "$should_add" = true ]; then
              DEPLOY_SERVICES+=("$base_service")
            fi
          done

          $COMPOSE_CMD -f "$COMPOSE_FILE" pull "${DEPLOY_SERVICES[@]}"
          $COMPOSE_CMD -f "$COMPOSE_FILE" up -d --build "${DEPLOY_SERVICES[@]}"
          $COMPOSE_CMD -f "$COMPOSE_FILE" ps "${DEPLOY_SERVICES[@]}"

          echo "Planned health URLs:"
          echo "  - Frontend /api/health -> http://127.0.0.1:3005/api/health"
          echo "  - Frontend /api/v1/tryon/health -> http://127.0.0.1:3005/api/v1/tryon/health"
          echo "  - Recommendation API OpenAPI -> http://127.0.0.1:8799/openapi.json"
          echo "  - Recommendation API docs -> http://127.0.0.1:8799/docs"

          check_url() {
            local service_label="$1"
            local url="$2"
            local timeout="${3:-60}"
            local elapsed=0
            local status
            local curl_err
            local response_file
            curl_err="$(mktemp)"
            response_file="$(mktemp)"
            while [ "$elapsed" -lt "$timeout" ]; do
              : > "$curl_err"
              : > "$response_file"
              status="$(curl -sS -o "$response_file" -w '%{http_code}' "$url" 2>"$curl_err" || true)"

              echo "Checking $service_label"
              echo "  URL: $url"
              echo "  HTTP status: ${status:-N/A}"
              if [[ "$status" =~ ^[0-9]+$ ]] && [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
                echo "Health check passed for $service_label"
                rm -f "$curl_err" "$response_file"
                return 0
              fi
              sleep 2
              elapsed=$((elapsed + 2))
            done
            echo "Health check failed for $service_label ($url)"
            echo "  Last status: ${status:-N/A}"
            if [ -s "$curl_err" ]; then
              echo "  curl error:"
              cat "$curl_err"
            fi
            cat "$response_file"
            echo "--- Tail backend logs ---"
            $COMPOSE_CMD -f "$COMPOSE_FILE" logs --tail 120 backend || true
            echo "--- Tail recommendation logs ---"
            $COMPOSE_CMD -f "$COMPOSE_FILE" logs --tail 120 recommendation-api || true
            rm -f "$curl_err" "$response_file"
            return 1
          }

          check_url "Frontend /api/health" "http://127.0.0.1:3005/api/health" 120
          check_url "Frontend /api/v1/tryon/health" "http://127.0.0.1:3005/api/v1/tryon/health" 120
          check_url "Recommendation API /openapi.json" "http://127.0.0.1:8799/openapi.json" 120
          $COMPOSE_CMD -f "$COMPOSE_FILE" ps recommendation-api | grep -q "Up" || {
            echo "recommendation-api container is not running"
            exit 1
          }
          EOF

      - name: Verify deployed API (health checks)
        working-directory: APP3005/aivestire-backend-tmp
        run: |
          GCP_SERVER_BASE_URL="${{ vars.GCP_SERVER_BASE_URL }}"
          if [ "${{ github.ref_name }}" = "uat-server" ]; then
            GCP_SERVER_BASE_URL="${{ vars.GCP_UAT_SERVER_BASE_URL }}"
          fi
          if [ -z "$GCP_SERVER_BASE_URL" ]; then
            GCP_SERVER_BASE_URL="${{ vars.GCP_UAT_SERVER_BASE_URL }}"
          fi
          if [ -z "$GCP_SERVER_BASE_URL" ] && [ "${{ github.ref_name }}" = "recommendation_model" ]; then
