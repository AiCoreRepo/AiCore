name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies (Backend)
        run: |
          cd APP3005/aivestire-backend-tmp
          npm ci

      - name: Run Tests (Backend)
        run: |
          cd APP3005/aivestire-backend-tmp
          npm run test --if-present

  deploy:
    name: Trigger Render Deploy
    needs: ci # Only run if CI passes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Deploy Hook
        # This triggers the Render Blueprint to sync/deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
            echo "Deployment triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK secret not found. Skipping manual trigger (Render Auto-Deploy might still work)."
          fi
