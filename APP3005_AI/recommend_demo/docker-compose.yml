services:
  streamlit:
    build:
      context: .
    command: ["uv", "run", "streamlit", "run", "app/main.py", "--server.port=8505", "--server.address=0.0.0.0"]
    ports:
      - "8505:8505"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    restart: unless-stopped

  api:
    build:
      context: .
    command: ["uv", "run", "uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8898"]
    ports:
      - "8898:8898"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
