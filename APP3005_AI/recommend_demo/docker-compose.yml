services:
  streamlit:
    build:
      context: .
    command: ["streamlit", "run", "app/main.py", "--server.port=8505", "--server.address=0.0.0.0"]
    ports:
      - "8505:8505"
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: fusion_training_embeddings
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./training.csv:/app/training.csv:ro
      - ./main_train_data.csv:/app/main_train_data.csv:ro
      - ./new_data:/app/new_data:ro
      - ./fashion_collection.json:/app/fashion_collection.json:ro
      - ./collection2.json:/app/collection2.json:ro
      - ./collection2_train.json:/app/collection2_train.json:ro
      - ./collection2_test.json:/app/collection2_test.json:ro
      - ./train_image:/app/train_image:ro
      - ./testiing_image_collection:/app/testiing_image_collection:ro

    restart: unless-stopped
    depends_on:
      - milvus
  fusion_api:
    build:
      context: .
    command: ["uvicorn", "app.fusion_api:app", "--host", "0.0.0.0", "--port", "8791"]
    ports:
      - "8791:8791"
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: fusion_training_embeddings
    volumes:
      - ./artifacts:/app/artifacts
      - ./collection2.json:/app/collection2.json:ro
      - ./collection2_train.json:/app/collection2_train.json:ro
      - ./collection2_test.json:/app/collection2_test.json:ro
    restart: unless-stopped
    depends_on:
      - milvus
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      [
        "etcd",
        "--advertise-client-urls",
        "http://0.0.0.0:2379",
        "--listen-client-urls",
        "http://0.0.0.0:2379",
        "--data-dir",
        "/etcd",
      ]
    volumes:
      - ./etcd:/etcd
    ports:
      - "2379:2379"
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - ./minio:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: "etcd:2379"
      MINIO_ADDRESS: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_USE_SSL: "false"
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./milvus:/var/lib/milvus
    restart: unless-stopped
    depends_on:
      - etcd
      - minio
  attu:
    image: zilliz/attu:latest
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8017:3000"
    depends_on:
      - milvus
    restart: unless-stopped
