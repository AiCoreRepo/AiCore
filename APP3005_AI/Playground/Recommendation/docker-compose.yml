services:
  streamlit:
    build: .
    container_name: recommendation-streamlit
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - ../../..:/workspace
    working_dir: /workspace/APP3005_AI/Playground/Recommendation
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
