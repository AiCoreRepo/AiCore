version: "3.9"

services:
  app:
    build: .
    container_name: streamlit-image-echo
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    # Uncomment the volume below for live reload during development
    # volumes:
    #   - .:/app
  embed:
    build:
      context: .
      dockerfile: Dockerfile.embed
    container_name: fashion-embed
    volumes:
      - ../../..:/workspace
    command:
      - python
      - /workspace/AiCore/APP3005_AI/ModelDemo/embedding.py
      - --input-json
      - /workspace/AiCore/APP3005_AI/Playground/Recommendation/Data/input/collection_one.json
      - --output-json
      - /workspace/AiCore/APP3005_AI/Playground/Recommendation/Data/output/embedded_collection_one.json
