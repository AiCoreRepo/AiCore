version: "3.9"

services:
  app:
    build: .
    container_name: streamlit-image-echo
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    # Uncomment the volume below for live reload during development
    # volumes:
    #   - .:/app
