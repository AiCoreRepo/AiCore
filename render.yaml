services:
  # Backend Service
  - type: web
    name: aivestire-backend
    env: node
    # Path relative to the repository root
    root: APP3005/aivestire-backend-tmp
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aivestire-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000

  # Frontend Service
  - type: web
    name: aivestire-frontend
    env: static
    # Path relative to the repository root
    root: APP3005/frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aivestire-backend
          property: url

databases:
  - name: aivestire-db
    databaseName: aivestire
    user: aivestire_user
    plan: free # Optional: specify plan
