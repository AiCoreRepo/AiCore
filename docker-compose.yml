services:
  db:
    image: postgres:15
    container_name: postgres-db-testcoth2
    command: ["postgres", "-p", "5540"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aivestire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aivestire -p 5540"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-server-testcoth2
    command: redis-server --appendonly yes --port 6380
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: nest-server
    command:
      [
        "sh",
        "-c",
        "set -e; node scripts/wait-for-services.mjs; node scripts/run-migrations.mjs; node scripts/seed-products.js; node dist/src/main"
      ]
    env_file:
      - ./APP3005/aivestire-backend-tmp/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5540/aivestire
      NODE_ENV: production
      FRONTEND_URL: https://aivestire.com
      FASTAPI_BODY_ANALYZE_URL: http://body-analyzer:8898/body_analyze_json
      FASTAPI_RECOMMENDATION_URL: ${FASTAPI_RECOMMENDATION_URL:-http://recommendation-api:8799/recommendation/ai-decide}
      RECOMMENDATION_DUMMY_ONLY: ${RECOMMENDATION_DUMMY_ONLY:-true}
      RECOMMENDATION_ML_ENABLED: ${RECOMMENDATION_ML_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      REDIS_HOST: redis
      REDIS_PORT: 6380
      AI_TIMING_LOGS: "true"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-image-preview}
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account.json
      SEED_COLLECTION_PATH: /app/seed/main_train_data.csv
      SEED_LIMIT: ${SEED_LIMIT:-200}
    volumes:
      - ./APP3005/aivestire-backend-tmp/service_account.json:/app/service_account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      body-analyzer:
        condition: service_started
      recommendation-api:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  backend-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: nest-worker
    command:
      [
        "sh",
        "-c",
        "set -e; node scripts/wait-for-services.mjs; IS_WORKER_PROCESS=true node dist/src/worker/main"
      ]
    env_file:
      - ./APP3005/aivestire-backend-tmp/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5540/aivestire
      NODE_ENV: production
      FRONTEND_URL: https://aivestire.com
      FASTAPI_BODY_ANALYZE_URL: http://body-analyzer:8898/body_analyze_json
      REDIS_HOST: redis
      REDIS_PORT: 6380
      AI_TIMING_LOGS: "true"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-image-preview}
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account.json
    volumes:
      - ./APP3005/aivestire-backend-tmp/service_account.json:/app/service_account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      body-analyzer:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set VITE_GOOGLE_CLIENT_ID in .env}
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    container_name: aivestire-frontend
    ports:
      - "127.0.0.1:3005:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  body-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      target: body-analyzer
    container_name: body-analyzer-api
    ports:
      - "127.0.0.1:8898:8898"
    restart: unless-stopped
    networks:
      - app-network

  recommendation-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: recommendation-api
    container_name: recommendation-api
    ports:
      - "127.0.0.1:8799:8799"
    environment:
      RECOMMENDATION_COLLECTION_PATH: /app/main_train_data.csv
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
