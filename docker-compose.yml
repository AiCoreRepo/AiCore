services:

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: postgres-db-testcoth2
    command: ["postgres", "-p", "5540"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aivestire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aivestire -p 5540"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5540"
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Redis (custom port 6380)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-server-testcoth2
    command: redis-server --appendonly yes --port 6380
    ports:
      - "127.0.0.1:6379:6380"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # AI — Body Analyzer (Python FastAPI)
  # ─────────────────────────────────────────────
  body-analyzer:
    build:
      context: ./APP3005_AI/Playground/vertexVT
      dockerfile: Dockerfile.body-analyzer
    container_name: body-analyzer-api
    ports:
      - "127.0.0.1:8898:8898"
    restart: unless-stopped
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # AI — Recommendation API
  # ─────────────────────────────────────────────
  recommendation-api:
    build:
      context: ./APP3005_AI/recommend_demo
      dockerfile: Dockerfile.api
    container_name: recommendation-api
    ports:
      - "127.0.0.1:8799:8799"
    environment:
      RECOMMENDATION_COLLECTION_PATH: /app/main_train_data.csv
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8799/openapi.json').status == 200 else 1)\""
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Backend API — NestJS HTTP server
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: nest-server
    command:
      [
        "sh", "-c",
        "set -e; node scripts/bootstrap-service-account.mjs; node scripts/wait-for-services.mjs; node scripts/run-migrations.mjs; node scripts/seed-products.js; node dist/src/main"
      ]
    env_file:
      # Local .env provides secrets (API keys, JWT, Cloudinary, etc.).
      # Any value listed under `environment:` below OVERRIDES the .env file.
      - ./APP3005/aivestire-backend-tmp/.env
    environment:
      # ── Database (Docker internal host) ──────
      DATABASE_URL: postgresql://postgres:postgres@db:5540/aivestire

      # ── Redis (Docker internal — overrides .env localhost:6379) ──────────
      REDIS_HOST: redis
      REDIS_PORT: "6380"
      REDIS_PASSWORD: ""

      # ── App ──────────────────────────────────
      NODE_ENV: production
      FRONTEND_URL: https://aivestire.com
      CORS_ORIGIN: ${CORS_ORIGIN:-}

      # ── Internal service URLs ─────────────────
      FASTAPI_BODY_ANALYZE_URL: http://body-analyzer:8898/body_analyze_json
      FASTAPI_RECOMMENDATION_URL: http://recommendation-api:8799/recommendation/ai-decide
      RECOMMENDATION_DUMMY_ONLY: "false"

      # ── Misc ─────────────────────────────────
      AI_TIMING_LOGS: "true"
      VERTEX_TRYON_ENABLED: "false"
      SEED_COLLECTION_PATH: /app/seed/main_train_data.csv
      SEED_LIMIT: ${SEED_LIMIT:-200}
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account.json
      SERVICE_ACCOUNT_FALLBACK_PATH: /app/runtime-config/service_account.json
    volumes:
      - ./APP3005/aivestire-backend-tmp:/app/runtime-config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      body-analyzer:
        condition: service_started
      recommendation-api:
        condition: service_healthy
    restart: unless-stopped
    # The healthcheck tells docker-compose when the API is truly ready
    # (migrations done, HTTP server listening). backend-worker waits on this.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Backend Worker — Bull queue consumer
  #
  # Differences vs the backend service:
  #   • Runs dist/src/worker/main  (no HTTP server)
  #   • IS_WORKER_PROCESS=true
  #   • depends_on backend:healthy → guarantees DB
  #     migrations are complete before jobs run
  #   • Same Redis env vars as backend (critical!)
  # ─────────────────────────────────────────────
  backend-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: nest-worker
    command:
      [
        "sh", "-c",
        "set -e; node scripts/bootstrap-service-account.mjs; node scripts/wait-for-services.mjs; IS_WORKER_PROCESS=true node dist/src/worker/main"
      ]
    env_file:
      - ./APP3005/aivestire-backend-tmp/.env
    environment:
      # ── Database ──────────────────────────────
      DATABASE_URL: postgresql://postgres:postgres@db:5540/aivestire

      # ── Redis — MUST point to the redis service, not localhost ────────────
      # The .env file has REDIS_HOST=localhost / REDIS_PORT=6379 (for local dev).
      # These overrides make the worker connect to the Docker Redis container.
      REDIS_HOST: redis
      REDIS_PORT: "6380"
      REDIS_PASSWORD: ""

      # ── App ──────────────────────────────────
      NODE_ENV: production
      IS_WORKER_PROCESS: "true"
      VERTEX_TRYON_ENABLED: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account.json
      SERVICE_ACCOUNT_FALLBACK_PATH: /app/runtime-config/service_account.json
    volumes:
      - ./APP3005/aivestire-backend-tmp:/app/runtime-config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for backend to be healthy = migrations done, API up.
      # Worker won't start consuming jobs until the schema is ready.
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Frontend — Vite build served via Node
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set VITE_GOOGLE_CLIENT_ID in .env}
        VITE_TRY_ON_DEFAULT_PROVIDER: ${VITE_TRY_ON_DEFAULT_PROVIDER:-gemini}
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    container_name: aivestire-frontend
    ports:
      - "127.0.0.1:3005:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
