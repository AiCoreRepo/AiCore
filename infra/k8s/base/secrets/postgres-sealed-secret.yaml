# infra/k8s/base/secrets/postgres-sealed-secret.yaml
# ──────────────────────────────────────────────────────────────────────────────
# PLACEHOLDER — contains NO real data. Do not apply this file as-is.
#
# The real (kubeseal-encrypted) secret is kept OUT of git, in your private store.
# Generate it and apply it to the cluster by hand (see DEPLOYMENT.md §5a):
#
#   kubectl create secret generic postgres-secret \
#     --from-literal=POSTGRES_USER=aivestire \
#     --from-literal=POSTGRES_PASSWORD="<strong-pw>" \
#     --from-literal=POSTGRES_DB=aivestire \
#     --namespace aivestire --dry-run=client -o yaml \
#     | kubeseal --format yaml --namespace aivestire \
#     > ~/aivestire-sealed-secrets-private/postgres-sealed-secret.yaml
#   kubectl apply -f ~/aivestire-sealed-secrets-private/postgres-sealed-secret.yaml
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: aivestire
spec:
  encryptedData:
    POSTGRES_USER: REPLACE_WITH_KUBESEAL_OUTPUT
    POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    POSTGRES_DB: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: postgres-secret
      namespace: aivestire
