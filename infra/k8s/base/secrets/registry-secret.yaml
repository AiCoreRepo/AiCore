# infra/k8s/base/secrets/registry-secret.yaml
# ──────────────────────────────────────────────────────────────────────────────
# GHCR Image Pull Secret — SealedSecret
#
# THIS IS A PLACEHOLDER. You must replace the `encryptedData` values with
# real kubeseal-encrypted values before this works.
#
# How to create the real SealedSecret:
# ──────────────────────────────────────────────────────────────────────────────
# 1. Install sealed-secrets controller on the cluster (one time):
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/\
#      latest/download/controller.yaml
#
# 2. Install kubeseal CLI locally:
#    brew install kubeseal   (macOS)
#    # or download binary: https://github.com/bitnami-labs/sealed-secrets/releases
#
# 3. Create the plain secret (DO NOT COMMIT THIS FILE):
#    kubectl create secret docker-registry registry-secret \
#      --docker-server=ghcr.io \
#      --docker-username=YOUR_GITHUB_USERNAME \
#      --docker-password=YOUR_GITHUB_PAT_WITH_READ_PACKAGES \
#      --docker-email=your@email.com \
#      --namespace aivestire \
#      --dry-run=client -o yaml > /tmp/registry-secret-plain.yaml
#
# 4. Seal it (SAFE to commit):
#    kubeseal --format yaml \
#      --namespace aivestire \
#      < /tmp/registry-secret-plain.yaml \
#      > infra/k8s/base/secrets/registry-secret.yaml
#
# 5. Delete the plain secret:
#    rm /tmp/registry-secret-plain.yaml
#
# 6. Commit infra/k8s/base/secrets/registry-secret.yaml
#
# ─────────────────────────────────────────────────────────────────────────────
# PLACEHOLDER — replace with output from kubeseal command above
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-secret
  namespace: aivestire
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Replace with: kubeseal output for .dockerconfigjson field
    .dockerconfigjson: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    type: kubernetes.io/dockerconfigjson
    metadata:
      name: registry-secret
      namespace: aivestire
