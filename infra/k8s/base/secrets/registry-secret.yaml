# infra/k8s/base/secrets/registry-secret.yaml
# ──────────────────────────────────────────────────────────────────────────────
# PLACEHOLDER — contains NO real data. Do not apply this file as-is.
#
# GHCR image-pull secret. Real secret kept OUT of git. Generate + apply by hand
# (see DEPLOYMENT.md §5d):
#
#   kubectl create secret docker-registry registry-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<GH_USERNAME> \
#     --docker-password=<GHCR_PAT_with_read_packages> \
#     --docker-email=admin@aivestire.com \
#     --namespace aivestire --dry-run=client -o yaml \
#     | kubeseal --format yaml --namespace aivestire \
#     > ~/aivestire-sealed-secrets-private/registry-sealed-secret.yaml
#   kubectl apply -f ~/aivestire-sealed-secrets-private/registry-sealed-secret.yaml
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-secret
  namespace: aivestire
spec:
  encryptedData:
    .dockerconfigjson: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    type: kubernetes.io/dockerconfigjson
    metadata:
      name: registry-secret
      namespace: aivestire
