# infra/k8s/base/secrets/backend-sealed-secret.yaml
# ──────────────────────────────────────────────────────────────────────────────
# PLACEHOLDER — contains NO real data. Do not apply this file as-is.
#
# Real secret kept OUT of git. Generate it with the full `kubectl create secret
# generic backend-secret --from-literal=...` command in DEPLOYMENT.md §5c, pipe
# through kubeseal, save to your private store, and apply by hand:
#
#   kubeseal --format yaml --namespace aivestire < backend-secret.plain.yaml \
#     > ~/aivestire-sealed-secrets-private/backend-sealed-secret.yaml
#   kubectl apply -f ~/aivestire-sealed-secrets-private/backend-sealed-secret.yaml
#
# The keys below document what backend-secret must contain (values are dummies).
# ──────────────────────────────────────────────────────────────────────────────
