# infra/k8s/base/ingress/ingress.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Ingress — ingress-nginx, HTTP-only (domain + TLS deferred on purpose)
#
# For first bring-up we serve plain HTTP with NO host restriction and NO
# cert-manager dependency. Reach the app at:
#     http://<NODE_IP>/                 (no DNS needed — host-less rule)
#     http://<NODE_IP>.nip.io/          (also works; nip.io maps the IP)
#
# Routing strategy:
#   ALL traffic → frontend:8080 (the nginx inside the frontend container is the
#   single edge router). That nginx then proxies:
#     /api/*  → backend:3000  (STRIPS /api — NestJS has no global /api prefix, so
#                              sending /api/* straight to the backend would 404)
#     /ai/body, /ai/recommend → body-analyzer / recommendation-api
#     /       → SPA (index.html)
#
# ── TO ADD A DOMAIN + HTTPS LATER ─────────────────────────────────────────────
#   1. Install cert-manager, then re-add `ingress/clusterissuer.yaml` to
#      base/kustomization.yaml.
#   2. Uncomment the cert-manager + ssl-redirect annotations and the `tls:` block
#      below, and set `host:` (and the tls host) to your domain or <IP>.nip.io.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aivestire-ingress
  namespace: aivestire
  annotations:
    # Route to the Service ClusterIP (kube-proxy DNAT) instead of directly to pod
    # endpoints. On this node the host firewall drops direct pod-IP traffic, so
    # the default endpoint routing returns 502; the ClusterIP/DNAT path works.
    nginx.ingress.kubernetes.io/service-upstream: "true"
    # Allow up to 50 MB request body (image uploads for try-on + body analysis)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Generous timeouts for AI inference endpoints (body analysis, recommendations)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # ── Re-enable these two once you have a domain + cert-manager ──────────────
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # Modern controller selector (replaces the old kubernetes.io/ingress.class).
  ingressClassName: nginx

  # ── TLS — commented until a domain + cert-manager are in place ───────────────
  # tls:
  #   - hosts:
  #       - <your-domain-or-IP>.nip.io
  #     secretName: aivestire-tls

  rules:
    # No `host:` → matches ANY host, so http://<NODE_IP>/ works with zero DNS.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
