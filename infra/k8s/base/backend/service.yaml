# infra/k8s/base/backend/service.yaml
# ClusterIP — only reachable inside the cluster.
# nginx Ingress routes /api/* → backend:3000
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aivestire
  labels:
    app: backend
    tier: api
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
