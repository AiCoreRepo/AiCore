# infra/k8s/base/redis/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aivestire
  labels:
    app: redis
    tier: data
  annotations:
    # Headless→ClusterIP changes the immutable clusterIP field, so have ArgoCD
    # replace (delete+recreate) the Service instead of a failing apply.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  # ClusterIP, NOT headless — see postgres/service.yaml. The host firewall on
  # this node drops direct pod-IP traffic; ClusterIP (kube-proxy DNAT) works.
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
