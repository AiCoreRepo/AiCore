# infra/k8s/base/redis/statefulset.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Redis 7 — StatefulSet
#
# Production decisions:
#   • StatefulSet: Bull queue workers need stable DNS to connect.
#     redis-0.redis.aivestire.svc.cluster.local is always the instance.
#   • appendonly yes: AOF persistence — survives pod restarts with data intact.
#   • requirepass: password from Kubernetes Secret (never plain text in YAML).
#   • 5 GB PVC: AOF log can grow; 5 GB is ample for queue workloads.
#   • Resources: 256 MB request / 512 MB limit — Redis is memory-efficient
#     for queue-only use (not a data cache here).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: aivestire
  labels:
    app: redis
    tier: data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: data
    spec:
      terminationGracePeriodSeconds: 30

      # Redis needs no root: it binds 6379 (>1024) and writes only to /data.
      # uid/gid 999 is the "redis" user in redis:7-alpine; fsGroup makes the
      # local-path PVC group-writable for it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          image: redis:7-alpine
          # requirepass must come from env so it's not hardcoded.
          # $(REDIS_PASSWORD) is expanded by the shell in CMD below.
          command:
            - sh
            - -c
            - |
              exec redis-server \
                --appendonly yes \
                --requirepass "$(REDIS_PASSWORD)" \
                --maxmemory 400mb \
                --maxmemory-policy allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            # redis-cli reads REDISCLI_AUTH automatically, so probes don't need
            # `-a <pw>` — which would expose the password in `ps` output and make
            # redis-cli print an "insecure" warning to the logs.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
