# infra/k8s/base/frontend/service.yaml
# ClusterIP — Ingress routes / → frontend:8080
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aivestire
  labels:
    app: frontend
    tier: web
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
