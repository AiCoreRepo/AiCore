# infra/k8s/base/kustomization.yaml
# Base resources — environment-agnostic.
# Overlays (test, prod, staging) inherit from here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespace must come first
  - namespace.yaml

  # Data layer
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/backup-cronjob.yaml

  - redis/statefulset.yaml
  - redis/service.yaml

  # Application layer
  - backend/deployment.yaml
  - backend/service.yaml

  - backend-worker/deployment.yaml

  - frontend/deployment.yaml
  - frontend/service.yaml

  - body-analyzer/deployment.yaml
  - body-analyzer/service.yaml

  - recommendation-api/deployment.yaml
  - recommendation-api/service.yaml

  # Ingress + TLS (orscope.aivestire.com via cert-manager / Let's Encrypt)
  - ingress/clusterissuer.yaml
  - ingress/ingress.yaml

  # Network segmentation (lock down the data tier)
  # TEMPORARILY DISABLED: k3s's built-in NetworkPolicy controller was not
  # honoring the tier-based `from` rule and blocked backend->postgres:5432
  # (verified: a tier=api pod could not reach 10.42.0.22:5432). Re-enable only
  # after validating a policy that works on this cluster (e.g. matchLabels peers
  # + the node/pod CIDR for kubelet probes).
  # - networkpolicy/networkpolicies.yaml

  # ── Secrets ─────────────────────────────────────────────────────────────────
  # Real SealedSecrets are intentionally kept OUT of git. The files in secrets/
  # are PLACEHOLDERS only (no real data). The real, kubeseal-encrypted secrets
  # live in your private store and are applied to the cluster by hand:
  #
  #     kubectl apply -f ~/aivestire-sealed-secrets-private/<file>.yaml
  #
  # They are left OUT of this kustomization on purpose so ArgoCD does NOT manage
  # or prune them (selfHeal would otherwise overwrite a hand-applied secret with
  # the placeholder). See DEPLOYMENT.md §5 and secrets/README.md.
  #
  # ⚠️  REQUIRED BEFORE FIRST DEPLOY — apply these to the cluster or the
  #     workloads will CrashLoop: postgres-secret, redis-secret, backend-secret,
  #     registry-secret.
  #
  # - secrets/postgres-sealed-secret.yaml
  # - secrets/redis-sealed-secret.yaml
  # - secrets/backend-sealed-secret.yaml
  # - secrets/registry-secret.yaml
